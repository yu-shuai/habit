workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      node: "18"
      xcode: "15"
      cocoapods: "1.14"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync to iOS
        script: |
          npx cap sync ios
      - name: Build iOS Project
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive
          xcodebuild -exportArchive -archivePath App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath ./build
    artifacts:
      - ios/App/build/*.ipa
      - ios/App/build/*.dSYM